 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول | جسر التواصل</title>
<meta name="theme-color" content="#3BA5C6">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // لو مسجّل دخول بالفعل، روح للرئيسية
  try { if (localStorage.getItem("token")) location.replace("/index.html"); } catch (e) {}
</script>
<script src="/shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/auth.css?v=2">
<link rel="stylesheet" href="/login/login.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="hand" viewBox="0 0 24 24"><path d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-1.08 0-2.1-.43-2.85-1.19L1 14.83s1.26-1.23 1.3-1.25c.22-.19.49-.29.79-.29.22 0 .42.06.6.16.04.01 4.31 2.46 4.31 2.46V4c0-.83.67-1.5 1.5-1.5S11 3.17 11 4v7h1V1.5c0-.83.67-1.5 1.5-1.5S15 .67 15 1.5V11h1V2.5c0-.83.67-1.5 1.5-1.5S19 1.67 19 2.5V11h1V5.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5z"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <img src="/images/logo-light.webp" alt="جسر التواصل" class="auth-logo logo-light"><img src="/images/logo-dark.webp" alt="جسر التواصل" class="auth-logo logo-dark">
    </div>
    <h1>أهلًا بعودتك <span class="wave"></span></h1>
    <p class="motto" id="motto" aria-live="polite"></p>
  </div>
</header>

<main class="card">
  <h2>تسجيل الدخول</h2>
  <p class="sub">ادخل/ي بالبريد الإلكتروني وكلمة المرور.</p>

  <form id="form" novalidate>
    <div class="field" id="f-email">
      <label class="lbl" for="email">البريد الإلكتروني<span class="req">*</span></label>
      <div class="input"><svg class="ios"><use href="#i-mail"/></svg>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required>
      </div>
      <div class="err-txt">يرجى كتابة بريد إلكتروني صحيح.</div>
    </div>

    <div class="field" id="f-pw">
      <label class="lbl" for="password">كلمة المرور<span class="req">*</span></label>
 <div class="input"><svg class="ios"><use href="#i-lock"/></svg>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••" dir="ltr" required>
        <button type="button" class="toggle" id="toggle" aria-label="إظهار كلمة المرور"><svg class="ios"><use href="#i-eye"/></svg></button>
      </div>
      <div class="err-txt">يرجى كتابة كلمة المرور.</div>
    </div>

    <button class="btn" id="btn" type="submit">تسجيل الدخول</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <p class="switch"><a href="/forgot.html">نسيت كلمة المرور؟</a></p>
  <p class="switch">ليس لديك حساب؟ <a href="/register.html">إنشاء حساب</a></p>
</main>

<script src="/login/login.js"></script>
<script src="/shared/pwa.js" defer></script>
</body>
</html>
